spring:
  application:
    name: sentinel-token-client

server:
  port: 8082

# Nacos 配置
nacos:
  server-addr: nacos:8848

# Token Server 配置
token:
  server:
    host: token-server
    port: 18730

# Sentinel Dashboard 配置
csp:
  sentinel:
    dashboard:
      server: sentinel-dashboard:8080
    port: 8720

# 日志配置
logging:
  level:
    com.alibaba.csp: INFO
    com.alibaba.csp.tokenclient: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
